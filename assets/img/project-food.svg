<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadowF" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgFood)" rx="16" />
  
  <g transform="translate(120, 50)" filter="url(#shadowF)">
    <rect width="560" height="350" rx="16" fill="#ffffff" />
    <rect width="560" height="55" rx="16" fill="#ea580c" />
    <text x="280" y="35" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PROJEK KEWIRAUSAHAAN SEKOLAH (PRODUK MAKANAN)</text>
    
    <!-- Sales / Product Graphic -->
    <rect x="40" y="85" width="230" height="150" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" />
    <circle cx="155" cy="140" r="32" fill="#ea580c" fill-opacity="0.15" />
    <!-- Shopping bag / food box -->
    <rect x="135" y="125" width="40" height="34" rx="4" fill="#ea580c" />
    <path d="M145 125 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#ea580c" stroke-width="3" />
    <text x="155" y="210" fill="#9a3412" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Penjualan &amp; Pelayanan</text>
    
    <rect x="290" y="85" width="230" height="150" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2" />
    <circle cx="405" cy="140" r="32" fill="#16a34a" fill-opacity="0.15" />
    <!-- Target reached chart -->
    <circle cx="405" cy="140" r="22" fill="none" stroke="#16a34a" stroke-width="5" stroke-dasharray="100" stroke-dashoffset="15" />
    <text x="405" y="145" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">100%</text>
    <text x="405" y="210" fill="#166534" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Target Penjualan Tercapai</text>
    
    <!-- Metrics bar -->
    <rect x="40" y="260" width="480" height="55" rx="8" fill="#f8fafc" />
    <text x="60" y="285" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Fokus:</text>
    <text x="105" y="285" fill="#475569" font-family="'Segoe UI', sans-serif" font-size="12">Kerjasama Tim, Inovasi Produk, Kepuasan Konsumen</text>
    <text x="60" y="303" fill="#1e293b" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Hasil:</text>
    <text x="105" y="303" fill="#16a34a" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Mencapai target omset &amp; respon pelanggan sangat positif</text>
  </g>
  <text x="400" y="445" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">PROYEK BISNIS &amp; PENJUALAN PRODUK MAKANAN</text>
</svg>
