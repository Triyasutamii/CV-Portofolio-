<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCanva" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4cc" />
      <stop offset="100%" stop-color="#7d2ae8" />
    </linearGradient>
    <filter id="shadowC" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgCanva)" rx="16" />
  
  <g transform="translate(100, 50)" filter="url(#shadowC)">
    <rect width="600" height="360" rx="16" fill="#ffffff" />
    <rect width="600" height="55" rx="16" fill="#7d2ae8" />
    <text x="300" y="35" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CANVA SOCIAL MEDIA & POSTER DESIGN</text>
    
    <!-- Feed Mockups -->
    <rect x="40" y="80" width="160" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <rect x="50" y="90" width="140" height="110" rx="6" fill="#06b6d4" />
    <circle cx="120" cy="140" r="22" fill="#ffffff" fill-opacity="0.8" />
    <text x="120" y="230" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Instagram Feed</text>
    <text x="120" y="250" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Storytelling & Tips</text>
    
    <rect x="220" y="80" width="160" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <rect x="230" y="90" width="140" height="110" rx="6" fill="#8b5cf6" />
    <polygon points="300,120 320,155 280,155" fill="#ffffff" fill-opacity="0.8" />
    <text x="300" y="230" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Poster Kegiatan</text>
    <text x="300" y="250" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Event Karang Taruna</text>
    
    <rect x="400" y="80" width="160" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <rect x="410" y="90" width="140" height="110" rx="6" fill="#ec4899" />
    <circle cx="480" cy="145" r="20" fill="#ffffff" fill-opacity="0.8" />
    <text x="480" y="230" fill="#334155" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Banner Promosi</text>
    <text x="480" y="250" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Katalog Makanan</text>
    
    <!-- Tools Tag -->
    <rect x="40" y="300" width="520" height="40" rx="8" fill="#f3e8ff" />
    <text x="300" y="325" fill="#6b21a8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Software: Canva Pro • Layouting • Visual Branding • Tipografi Kreatif</text>
  </g>
  <text x="400" y="455" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">KARYA DESAIN GRAFIS MEDIA SOSIAL</text>
</svg>
