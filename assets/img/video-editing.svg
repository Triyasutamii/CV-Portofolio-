<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Video Player Mockup -->
  <g transform="translate(100, 60)" filter="url(#shadow)">
    <rect width="600" height="340" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Top Bar -->
    <rect width="600" height="40" rx="14" fill="#1e293b" />
    <circle cx="30" cy="20" r="6" fill="#ef4444" />
    <circle cx="50" cy="20" r="6" fill="#f59e0b" />
    <circle cx="70" cy="20" r="6" fill="#10b981" />
    <text x="300" y="25" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13" text-anchor="middle" font-weight="600">CapCut Video Project Editor - Timeline</text>
    
    <!-- Video Preview Screen -->
    <rect x="30" y="60" width="360" height="190" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <!-- Play Icon -->
    <circle cx="210" cy="155" r="30" fill="#6366f1" fill-opacity="0.8" />
    <polygon points="202,140 202,170 225,155" fill="#ffffff" />
    
    <!-- Timeline Tracks -->
    <rect x="410" y="60" width="160" height="85" rx="8" fill="#1e293b" />
    <text x="420" y="85" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">VIDEO TRACKS</text>
    <rect x="420" y="95" width="140" height="16" rx="4" fill="#3b82f6" />
    <rect x="420" y="118" width="90" height="16" rx="4" fill="#8b5cf6" />
    
    <rect x="410" y="165" width="160" height="85" rx="8" fill="#1e293b" />
    <text x="420" y="190" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">AUDIO & BGM</text>
    <rect x="420" y="200" width="140" height="16" rx="4" fill="#10b981" />
    <rect x="420" y="223" width="110" height="16" rx="4" fill="#06b6d4" />
    
    <!-- Timeline Bottom Bar -->
    <rect x="30" y="270" width="540" height="45" rx="6" fill="#090d16" />
    <line x1="160" y1="270" x2="160" y2="315" stroke="#ef4444" stroke-width="2" />
    <text x="45" y="297" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">00:01:24 / 00:03:10</text>
    <text x="490" y="297" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">HD 1080p 60fps</text>
  </g>
  <text x="400" y="445" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="bold" text-anchor="middle" letter-spacing="1">PROJECT VIDEO CREATOR & CAPCUT EDITING</text>
</svg>
